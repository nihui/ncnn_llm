name: cmake-build

on:
  push:
    branches: [main, "infra/**", "model/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} / CMake
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci --parallel 2

      - name: Test
        run: ctest --preset ci

      - name: Install
        run: cmake --install build/ci --prefix dist

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-${{ runner.os }}-logs
          path: |
            build/ci/Testing/Temporary/
            build/ci/CMakeCache.txt
          if-no-files-found: ignore
          retention-days: 30
